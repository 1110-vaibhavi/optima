<html>
    <head>
         <link rel="stylesheet" href="bootstrap-icons.css">
        <title>Order Place</title>
        <style>
            body{
                 background-image:radial-gradient(white,#2c0f7cd3);
                 display: flex;
                 justify-content: center;
                 align-content: center;
            }

            .container{
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 20%;
             height: 500px;
             width: auto;
               overflow: hidden;
               animation: popupandshine 0.6s ease-out forwards;
            }
            .container::after{
                content: '';
                position: absolute;
                top: 0;
                left: -150%;
                width: 50%;
                height: 100%;
                background: linear-gradient(90deg,
                rgba(255,255,255,0)0%,
                rgba(255,255,255,0.8)50%,
                rgba(255,255,255,0)100%);
                transform: skewX(-20deg);
                animation: shineeffect .9s  ease-in-out 0.5s forwards;
            }
            @keyframes popupandshine {
                0%{
                    transform: scale(0) rotateY(-90deg);
                    opacity: 0;
                }
                60%{
                    transform: scale(1.05)rotateY(10deg);
                    opacity: 1;
                }
                100%{
                    transform: scale(1) rotateY(0deg);
                }
            }
            @keyframes shineeffect {
                0%{
                    left:-150%;
                }
                100%{
                    left: 150%;
                }
            }
            i{
                display: contents;
                color: green;
                font-size: 300px;
            }
            h2{
                display: content;
                justify-content: center;
                color: green;
                font-size: 50px;
                   font-family: sans-serif;
                  
                  bottom: 30%;
            }
          
        </style>
    </head>
    <body>
        <div class="container">
        <i class="bi bi-check-circle"></i>
         <h2>ORDER PLACED</h2>
          </div>
    </body>
</html>
